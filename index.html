<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Updated Title to FocusForge Dashboard -->
    <title>FocusForge Dashboard</title>
    <!-- Load Tailwind CSS from CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind to use the 'Inter' font and enable custom styles -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        // Custom font stack for a digital look on the time
                        digital: ['SF Mono', 'Roboto Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom styles for the Glassmorphism effect */
        .glass-clock {
            /* Background color with transparency */
            background-color: rgba(255, 255, 255, 0.15);
            /* Backdrop blur effect */
            backdrop-filter: blur(10px);
            /* Webkit prefix for compatibility */
            -webkit-backdrop-filter: blur(10px);
            /* Subtle border for definition */
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen p-4 sm:p-8">

    <!-- Main Dashboard Container -->
    <div class="max-w-6xl mx-auto">

        <!-- Header and Clock Section -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-10">
            <!-- Updated Heading -->
            <h1 class="text-4xl font-extrabold text-blue-400 mb-4 sm:mb-0">FocusForge Tasks</h1>

            <!-- IST Clock Container (Top-Right/Center Aligned) -->
            <div id="ist-clock-container" class="glass-clock p-4 rounded-xl shadow-lg w-full sm:w-auto transition duration-300 hover:shadow-2xl">
                <!-- Date element (simple font) -->
                <div id="ist-date" class="text-sm font-light text-gray-200 mb-1">
                    <!-- Date will be inserted here -->
                </div>
                <!-- Time element (digital style font) -->
                <div id="ist-time" class="text-3xl font-digital font-bold text-blue-300">
                    <!-- Time will be inserted here -->
                </div>
            </div>
        </header>

        <!-- To-Do List Application Area -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-xl">
            <h2 class="text-2xl font-semibold mb-4 text-gray-100">To-Do List</h2>
            
            <!-- Input and Add Button -->
            <div class="flex space-x-2 mb-6">
                <input type="text" id="new-task-input" placeholder="Add a new task..." 
                       class="flex-grow p-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                <button id="add-task-btn" 
                        class="px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-md transition duration-150 ease-in-out">
                    Add Task
                </button>
            </div>

            <!-- Task List Container -->
            <ul id="task-list" class="space-y-3">
                <!-- Example Task -->
                <li class="flex items-center justify-between bg-gray-700 p-3 rounded-lg shadow-inner">
                    <span class="text-lg">Set up live IST clock functionality</span>
                    <button onclick="this.parentNode.remove()" 
                            class="text-red-400 hover:text-red-500 transition duration-150">
                        &times;
                    </button>
                </li>
            </ul>
        </div>

    </div>

    <script>
        // Get references to the DOM elements where the time and date will be displayed
        const istTimeElement = document.getElementById('ist-time');
        const istDateElement = document.getElementById('ist-date');
        const addTaskBtn = document.getElementById('add-task-btn');
        const newTaskInput = document.getElementById('new-task-input');
        const taskList = document.getElementById('task-list');

        /**
         * Updates the displayed time and date to the current Indian Standard Time (IST).
         * This function uses the browser's built-in Internationalization API (Intl.DateTimeFormat)
         * to reliably format the date and time for the 'Asia/Kolkata' timezone.
         */
        function updateISTClock() {
            // Create a new Date object representing the current moment
            const now = new Date();

            // --- DATE FORMATTING ---
            // Define options for formatting the date to include weekday, month, day, and year
            const dateOptions = {
                timeZone: 'Asia/Kolkata', // Set the specific timezone
                weekday: 'long',         // Full weekday name (e.g., Friday)
                year: 'numeric',         // Full year (e.g., 2025)
                month: 'long',           // Full month name (e.g., October)
                day: 'numeric'           // Day of the month (e.g., 24)
            };
            // Format the date using English locale (en-US) and the defined options
            const formattedDate = new Intl.DateTimeFormat('en-US', dateOptions).format(now);
            
            // --- TIME FORMATTING ---
            // Define options for formatting the time to include hour, minute, second, and AM/PM
            const timeOptions = {
                timeZone: 'Asia/Kolkata', // Set the specific timezone
                hour: '2-digit',          // Hour in two digits
                minute: '2-digit',        // Minute in two digits
                second: '2-digit',        // Second in two digits
                hour12: true              // Use 12-hour clock (AM/PM)
            };
            // Format the time
            const formattedTime = new Intl.DateTimeFormat('en-US', timeOptions).format(now);

            // --- UPDATE DOM ---
            // Combine the calendar icon and the formatted date string, and update the date element
            istDateElement.innerHTML = `📅 ${formattedDate}`;
            
            // Combine the clock icon and the formatted time string, and update the time element
            istTimeElement.innerHTML = `⏰ ${formattedTime}`;
        }

        /**
         * Adds a new task to the list based on the input field content.
         */
        function addTask() {
            // Trim the value from the input field
            const taskText = newTaskInput.value.trim();

            // Check if the input is not empty
            if (taskText !== "") {
                // Create a new list item element
                const listItem = document.createElement('li');
                // Apply Tailwind classes for styling the new task item
                listItem.className = 'flex items-center justify-between bg-gray-700 p-3 rounded-lg shadow-inner';
                
                // Set the inner HTML for the task content and a delete button
                listItem.innerHTML = `
                    <span class="text-lg">${taskText}</span>
                    <button onclick="this.parentNode.remove()" 
                            class="text-red-400 hover:text-red-500 transition duration-150">
                        &times;
                    </button>
                `;

                // Append the new list item to the main task list
                taskList.appendChild(listItem);

                // Clear the input field after adding the task
                newTaskInput.value = '';
            }
        }

        // Attach the addTask function to the "Add Task" button click event
        addTaskBtn.addEventListener('click', addTask);
        
        // Allow adding tasks by pressing the Enter key in the input field
        newTaskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // --- CLOCK INITIALIZATION ---
        // Call the function immediately to show the time and date on load
        updateISTClock();
        
        // Call the function every 1000 milliseconds (1 second) to create a live clock effect
        setInterval(updateISTClock, 1000);

    </script>
</body>
</html>
